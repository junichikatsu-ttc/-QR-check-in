<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <title>QRチェックイン</title>
    <!--
      ★ ?v=__ASSET_VERSION__ を外さないこと。
      実行環境の前段キャッシュが .css / .js を max-age=14400 に上書きするため、
      no-cache は効かない。URL を変えるしかない（pitfalls 1）。
      __ASSET_VERSION__ は配信時にコミットハッシュへ置換される。
      相対パスで書くこと（先頭 / を付けるとトリガーのパスの外に出る）。
    -->
    <link rel="stylesheet" href="styles.css?v=__ASSET_VERSION__" />
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <h1>QRチェックイン</h1>
        <a class="header-link" href="teacher.html">先生はこちら</a>
      </header>

      <section data-view="login" id="login-view" hidden>
        <p class="lead">学籍番号を入力してください。</p>
        <form id="login-form" class="stack">
          <input
            id="student-id"
            type="text"
            inputmode="latin"
            autocomplete="username"
            autocapitalize="characters"
            maxlength="32"
            placeholder="学籍番号"
            required
          />
          <button id="login-button" type="submit" class="primary">QR を表示する</button>
        </form>
        <p id="login-error" class="error" hidden></p>
      </section>

      <section data-view="qr" id="qr-view" hidden>
        <div class="card qr-card">
          <div class="student">
            <div id="student-name" class="student-name"></div>
            <div id="student-meta" class="student-meta"></div>
          </div>
          <canvas id="qr" class="qr" width="320" height="320" aria-label="チェックイン用 QR コード"></canvas>
          <p id="countdown" class="countdown"></p>
          <p id="qr-stale" class="error" hidden>QR を更新できませんでした。電波を確認して「更新」を押してください</p>
          <p class="hint">先生にこの画面を見せてください。画面の明るさを上げると読み取りやすくなります。</p>
        </div>
        <div class="actions">
          <button id="refresh-button" type="button" class="secondary">更新</button>
          <button id="logout-button" type="button" class="link">ログアウト</button>
        </div>
      </section>
    </main>
    <div id="toast" class="toast" hidden></div>

    <script src="app.js?v=__ASSET_VERSION__"></script>
  </body>
</html>
